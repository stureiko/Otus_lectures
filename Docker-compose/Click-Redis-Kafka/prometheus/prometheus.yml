global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'producer'
    static_configs:
      - targets: ['producer:8000']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'consumer'
    static_configs:
      - targets: ['consumer:8001']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'redis_exporter'
    static_configs:
      - targets: ['redis_exporter:9121']
    scrape_interval: 10s

  - job_name: 'kafka_exporter'
    static_configs:
      - targets: ['kafka_exporter:9308']
    scrape_interval: 10s

  - job_name: 'clickhouse_exporter'
    static_configs:
      - targets: ['clickhouse_exporter:9116']
    scrape_interval: 10s