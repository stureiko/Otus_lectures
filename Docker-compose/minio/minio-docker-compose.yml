services:
  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    healthcheck:
      test: timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      interval: 1s
      timeout: 10s
      retries: 5
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web UI
    volumes:
      - only_minio_data:/data
    networks:
      - mlflow_net

  mc:
    image: minio/mc
    container_name: mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c '
        echo "✅ MinIO is ready, configuring mc..." ; \
        echo "🔍 Getting MinIO IP...";
        MINIO_IP=$$(getent hosts s3_mlflow | cut -d" " -f1);
        echo "✅ MinIO IP is $$MINIO_IP";
        echo "⚙️ Setting mc alias...";
        mc alias set --insecure local http://$$MINIO_IP:9000 minio_user minio_password;
        echo "📦 Creating bucket...";
        mc mb -p local/mlflow-bucket || true;
        echo "✅ Bucket mlflow-bucket ready";
      '
    networks:
      - mlflow_net

volumes:
  only_minio_data:

networks:
  mlflow_net: