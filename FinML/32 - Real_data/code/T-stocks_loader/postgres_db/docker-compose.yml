services:
  postgres:
    image: postgres:14.8-alpine3.18
    environment:
      POSTGRES_DB: "otus_db"
      POSTGRES_USER: "otus_user"
      POSTGRES_PASSWORD: "otus_password"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - ../otus_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otus_user -d otus_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '5'
          memory: 100G
volumes:
  otus_db: