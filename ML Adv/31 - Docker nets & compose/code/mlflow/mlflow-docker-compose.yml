version: "3.9"

services:
  mlflow:
    # image: ghcr.io/mlflow/mlflow:latest
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    container_name: mlflow
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflowpass@postgres:5432/mlflowdb
      --artifacts-destination s3://mlflow-bucket
      --host 0.0.0.0
      --port 5005
    ports:
      - "5005:5005"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio_user
      AWS_SECRET_ACCESS_KEY: minio_password
    depends_on:
      - postgres
      - minio
    networks:
      - mlflow_net

  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflowpass
      POSTGRES_DB: mlflowdb
    ports:
      - "5455:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mlflow_net

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    healthcheck:
      test: timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      interval: 1s
      timeout: 10s
      retries: 5
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web UI
    volumes:
      - minio_data:/data
    networks:
      - mlflow_net

  mc:
    image: minio/mc
    container_name: mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        sleep 3 && \
        mc alias set local http://minio:9000 minio_user minio_password && \
        mc mb -p local/mlflow-bucket || true && \
        echo '✅ Bucket mlflow-bucket ready'
      "
    networks:
      - mlflow_net

volumes:
  pgdata:
  minio_data:

networks:
  mlflow_net: